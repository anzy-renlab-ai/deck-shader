[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-shader"
version = "0.2.0"
description = "Decks whose light is computed, not painted — WebGL shader backgrounds exported to editable .pptx"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "anzy-renlab-ai" }]
keywords = ["pptx", "webgl", "shader", "slides", "presentation", "python-pptx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["python-pptx>=0.6.21", "Pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/anzy-renlab-ai/deck-shader"
Repository = "https://github.com/anzy-renlab-ai/deck-shader"
Demo = "https://anzy-renlab-ai.github.io/deck-shader/"

[project.scripts]
deck-shader = "deck_shader.cli:main"

[tool.setuptools.packages.find]
include = ["deck_shader*"]
namespaces = true

[tool.setuptools.package-data]
deck_shader = ["template.html", "presets/*.json"]
