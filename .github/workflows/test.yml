name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Chrome version (the render pipeline needs it)
        run: google-chrome --version

      - name: Test
        run: pytest -q

      - name: Build the reference deck
        run: deck-shader examples/precision/deck.json --out /tmp/deck.pptx

      - name: Check what it weighs
        run: |
          ls -la /tmp/deck*.jpg /tmp/deck.pptx
          test $(stat -c%s /tmp/deck.pptx) -lt 1500000
