name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12"]
        include:
          # ubuntu-latest (26.04) 已经不提供 3.9 的 action 二进制了
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Chrome version (the render pipeline needs it)
        run: google-chrome --version

      - name: Test
        run: pytest -q

      - name: Build the reference deck
        run: deck-shader examples/precision/deck.json --out /tmp/deck.pptx

      - name: Check what it weighs
        run: |
          ls -la /tmp/deck*.jpg /tmp/deck.pptx
          test $(stat -c%s /tmp/deck.pptx) -lt 1500000
